name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: miles
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: miles_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miles"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The Laravel app lives in central-app/; ops/, docs/, packages/ and
    # examples/ stay at the repository root.
    defaults:
      run:
        working-directory: central-app

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: miles
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, intl, zip, sodium, gd
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Create test database
        run: psql -h 127.0.0.1 -U miles -d miles_platform -c 'CREATE DATABASE miles_platform_test'
        env:
          PGPASSWORD: secret

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  # The library every product uses to connect to the platform.
  platform-client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/platform-client

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, openssl
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Lint, analyse and test
        run: composer ci

  # The starting point for new products (templates/new-product.php copies it).
  product-template:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: templates/product-app

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, openssl
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install
        run: |
          cp .env.example .env
          composer install --no-interaction --no-progress
          php artisan key:generate
          npm ci
          php artisan wayfinder:generate --with-form

      - name: Lint, analyse and test
        run: composer ci:check

  # Pharmacy runs its tests on PostgreSQL: stock constraints and the
  # append-only ledger live in the database.
  pharmacy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: miles
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: pharmacy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miles"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: pharmacy-app

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: pharmacy_test
      DB_USERNAME: miles
      DB_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, openssl
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install
        run: |
          cp .env.example .env
          composer install --no-interaction --no-progress
          php artisan key:generate
          npm ci
          php artisan wayfinder:generate --with-form

      - name: Lint, analyse and test
        run: composer ci:check
