<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Tatook M&amp;E</title>
<link rel="icon" href="icons/icon-192.png">
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --ink: #14281d; --muted: #4b5f53; --accent: #166534; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111814; --ink: #e7efe9; --muted: #a3b5a9; --accent: #4ade80; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 28rem; text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 1.375rem; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  .button { display: inline-block; padding: 10px 18px; background: var(--accent); color: #fff; text-decoration: none; }
</style>
</head>
<body>
<main>
  <img src="icons/icon-192.png" alt="">
  <h1>You are offline</h1>
  <p>M&amp;E needs a connection to show your workspace's data. Nothing is kept in this browser while offline.
     Field data collected on phones is saved in the M&amp;E field app and is sent when it reconnects.</p>
  <a class="button" href="./">Try again</a>
</main>
</body>
</html>
