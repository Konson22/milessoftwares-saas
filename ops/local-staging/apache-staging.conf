# XAMPP Apache in front of the php-cgi pool: local stand-in for
# ops/nginx/milessoftwares.conf (Windows rehearsal only).
#
# Copied to D:/srv/apache/miles-staging.conf and included from the end of
# C:/xampp/apache/conf/httpd.conf. Differences from nginx:
#   - No catch-all that refuses unknown hosts: XAMPP's own default vhosts
#     keep answering for localhost and the other local sites.
#   - php-cgi instead of php-fpm, balanced over services.ps1's workers.

<IfModule !proxy_fcgi_module>
    LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
</IfModule>
<IfModule !proxy_balancer_module>
    LoadModule proxy_balancer_module modules/mod_proxy_balancer.so
</IfModule>
<IfModule !lbmethod_byrequests_module>
    LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so
</IfModule>
<IfModule !slotmem_shm_module>
    LoadModule slotmem_shm_module modules/mod_slotmem_shm.so
</IfModule>

<Proxy "balancer://miles-php">
    BalancerMember "fcgi://127.0.0.1:9201" retry=1
    BalancerMember "fcgi://127.0.0.1:9202" retry=1
    BalancerMember "fcgi://127.0.0.1:9203" retry=1
    BalancerMember "fcgi://127.0.0.1:9204" retry=1
    BalancerMember "fcgi://127.0.0.1:9205" retry=1
    BalancerMember "fcgi://127.0.0.1:9206" retry=1
    ProxySet lbmethod=byrequests timeout=60
</Proxy>

<VirtualHost *:80>
    ServerName staging.milessoftwares.com
    ServerAlias *.staging.milessoftwares.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName staging.milessoftwares.com
    ServerAlias *.staging.milessoftwares.com

    SSLEngine on
    SSLCertificateFile "D:/srv/tls/staging.crt"
    SSLCertificateKeyFile "D:/srv/tls/staging.key"
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off
    SSLSessionTickets off

    DocumentRoot "D:/srv/miles/current/public"
    <Directory "D:/srv/miles/current/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    LimitRequestBody 10485760
    ServerSignature Off
    ErrorLog "D:/srv/miles/shared/storage/logs/apache-error.log"
    CustomLog "D:/srv/miles/shared/storage/logs/apache-access.log" combined

    # Hashed build assets never change; cache them for a year.
    <Location "/build/">
        Header set Cache-Control "public, max-age=31536000, immutable"
        Header set X-Content-Type-Options "nosniff"
    </Location>

    RewriteEngine On
    # Never serve dotfiles (.env, .git) even if one ends up under public/.
    RewriteRule "(^|/)\.(?!well-known/)" - [R=404,L]
    # No PHP file is reachable directly, index.php included (nginx: internal).
    RewriteCond %{THE_REQUEST} "\.php[\s/?]" [NC]
    RewriteRule ^ - [R=404,L]
    # Everything that is not an existing file goes to the front controller.
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteRule ^ /index.php [L]

    ProxyFCGIBackendType GENERIC
    <FilesMatch "^index\.php$">
        SSLOptions +StdEnvVars
        SetHandler "proxy:balancer://miles-php"
    </FilesMatch>
</VirtualHost>
