# Projects lives in project-management, not projects-app.
# Copy to /etc/systemd/system/miles-product-queue@projects.service.d/.
[Service]
WorkingDirectory=/srv/miles/current/project-management
ExecStart=
ExecStart=/usr/bin/php /srv/miles/current/project-management/artisan queue:work --sleep=1 --tries=3 --max-time=3600 --memory=256
