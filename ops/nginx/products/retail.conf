# Retail at {slug}.milessoftwares.com/retail (and the platform's calls to
# /retail/platform/...). Included inside the HTTPS server block of
# milessoftwares.conf. Copy to /etc/nginx/miles-products/retail.conf.
#
# Retail is hosted by the ERP workspace application (ADR-0003): the same
# pharmacy-app release and php-fpm pool as pharmacy.conf, its routes
# registered under /retail. Its pages load their assets from /pharmacy/build.

location = /retail {
    return 301 /retail/;
}

location ^~ /retail/ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.4-fpm-pharmacy.sock;
    fastcgi_param SCRIPT_FILENAME /srv/miles/current/pharmacy-app/public/index.php;
    # Front controller at the root: Laravel sees the full /retail/... path,
    # which is what its routes are registered under.
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /srv/miles/current/pharmacy-app/public;
    fastcgi_param HTTPS on;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 60s;
}
