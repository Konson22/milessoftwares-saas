# M&E at {slug}.milesoftwares.com/mel and the platform's calls to
# /mel/platform/.... Included inside the HTTPS server block of
# milesoftwares.conf. Copy to /etc/nginx/miles-products/mel.conf.
#
# The product runs in its own php-fpm pool (workers and limits of its
# own). Laravel routes are registered under /mel, so the path is passed
# through unchanged with SCRIPT_NAME=/index.php. On other hosts (apex, auth., app.,
# admin.) the product answers 404: it only serves workspaces.

location = /mel {
    return 301 /mel/;
}

# Hashed build assets never change.
location ^~ /mel/build/ {
    # Built into public/mel/build, so the URL maps onto public/ as is.
    root /srv/miles/current/mel-app/public;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
}

location ^~ /mel/ {
    # Evidence files go up to 20 MB (App\Mel\Evidence::MAX_KILOBYTES).
    client_max_body_size 22m;

    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.4-fpm-mel.sock;
    fastcgi_param SCRIPT_FILENAME /srv/miles/current/mel-app/public/index.php;
    # Front controller at the root: Laravel sees the full /mel/... path,
    # which is what its routes are registered under.
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /srv/miles/current/mel-app/public;
    fastcgi_param HTTPS on;
    fastcgi_hide_header X-Powered-By;
    # A spreadsheet import of a few thousand rows is checked in the request.
    fastcgi_read_timeout 120s;
}
