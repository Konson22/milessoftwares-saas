# Payroll at {slug}.milesoftwares.com/payroll, its events endpoint
# (/payroll/events, from HR and products) and the platform's calls to
# /payroll/platform/.... Included inside the HTTPS server block of
# milesoftwares.conf. Copy to /etc/nginx/miles-products/payroll.conf.
#
# The product runs in its own php-fpm pool (workers and limits of its
# own). Laravel routes are registered under /payroll, so the path is passed
# through unchanged with SCRIPT_NAME=/index.php. On other hosts (apex, auth., app.,
# admin.) the product answers 404: it only serves workspaces.

location = /payroll {
    return 301 /payroll/;
}

# Hashed build assets never change.
location ^~ /payroll/build/ {
    # Built into public/payroll/build, so the URL maps onto public/ as is.
    root /srv/miles/current/payroll-app/public;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
}

location ^~ /payroll/ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.4-fpm-payroll.sock;
    fastcgi_param SCRIPT_FILENAME /srv/miles/current/payroll-app/public/index.php;
    # Front controller at the root: Laravel sees the full /payroll/... path,
    # which is what its routes are registered under.
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /srv/miles/current/payroll-app/public;
    fastcgi_param HTTPS on;
    fastcgi_hide_header X-Powered-By;
    # A payroll run for a few hundred people is prepared in the request.
    fastcgi_read_timeout 120s;
}
