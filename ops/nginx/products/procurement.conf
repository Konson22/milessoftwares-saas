# Tatook Procurement at {slug}.milessoftwares.com/procurement (ADR-0023: its own
# application) and the platform's calls to /procurement/platform/....
# Included inside the HTTPS server block of milesoftwares.conf. Copy to
# /etc/nginx/miles-products/procurement.conf.
#
# The product runs in its own php-fpm pool. Laravel routes are registered
# under /procurement, so the path is passed through unchanged with
# SCRIPT_NAME=/index.php. On other hosts (apex, auth., app., admin.) the
# product answers 404: it only serves workspaces.

location = /procurement {
    return 301 /procurement/;
}

# Hashed build assets never change.
location ^~ /procurement/build/ {
    # Built into public/procurement/build, so the URL maps onto public/ as is.
    root /srv/miles/current/procurement-app/public;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
}

location ^~ /procurement/ {
    # Supporting documents go up to 20 MB (App\Procurement\Documents::MAX_KILOBYTES).
    client_max_body_size 22m;

    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.4-fpm-procurement.sock;
    fastcgi_param SCRIPT_FILENAME /srv/miles/current/procurement-app/public/index.php;
    # Front controller at the root: Laravel sees the full /procurement/...
    # path, which is what its routes are registered under.
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /srv/miles/current/procurement-app/public;
    fastcgi_param HTTPS on;
    fastcgi_hide_header X-Powered-By;
    # The orders CSV export streams in the request.
    fastcgi_read_timeout 120s;
}
