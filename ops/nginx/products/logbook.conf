# Tatook Logbook at {slug}.milessoftwares.com/logbook (ADR-0025: its own
# application) and the platform's calls to /logbook/platform/....
# Included inside the HTTPS server block of milesoftwares.conf. Copy to
# /etc/nginx/miles-products/logbook.conf.
#
# The product runs in its own php-fpm pool. Laravel routes are registered
# under /logbook, so the path is passed through unchanged with
# SCRIPT_NAME=/index.php. On other hosts (apex, auth., app., admin.) the
# product answers 404: it only serves workspaces.

location = /logbook {
    return 301 /logbook/;
}

# Hashed build assets never change.
location ^~ /logbook/build/ {
    # Built into public/logbook/build, so the URL maps onto public/ as is.
    root /srv/miles/current/logbook-app/public;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
}

# The logo and tab icons (public/logbook/images).
location ^~ /logbook/images/ {
    root /srv/miles/current/logbook-app/public;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
}

location ^~ /logbook/ {
    # Attachments go up to 10 MB each (App\Logbook\Attachments::MAX_KILOBYTES).
    client_max_body_size 12m;

    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.4-fpm-logbook.sock;
    fastcgi_param SCRIPT_FILENAME /srv/miles/current/logbook-app/public/index.php;
    # Front controller at the root: Laravel sees the full /logbook/...
    # path, which is what its routes are registered under.
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /srv/miles/current/logbook-app/public;
    fastcgi_param HTTPS on;
    fastcgi_hide_header X-Powered-By;
    # CSV and PDF exports are built in the request.
    fastcgi_read_timeout 120s;
}
