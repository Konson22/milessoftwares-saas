# Pharmacy at {slug}.milessoftwares.com/pharmacy (and the platform's calls to
# /pharmacy/platform/...). Included inside the HTTPS server block of
# milessoftwares.conf. Copy to /etc/nginx/miles-products/pharmacy.conf.
#
# The product runs in its own php-fpm pool (user, limits and opcache of its
# own). SCRIPT_NAME carries the /pharmacy prefix, so Laravel builds
# /pharmacy/... URLs and its routes need no prefix. On other hosts (apex,
# auth., app., admin.) the product answers 404: it only serves workspaces.

location = /pharmacy {
    return 301 /pharmacy/;
}

# Hashed build assets never change.
location ^~ /pharmacy/build/ {
    alias /srv/miles/current/pharmacy-app/public/build/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
}

location ^~ /pharmacy/ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.4-fpm-pharmacy.sock;
    fastcgi_param SCRIPT_FILENAME /srv/miles/current/pharmacy-app/public/index.php;
    fastcgi_param SCRIPT_NAME /pharmacy/index.php;
    fastcgi_param DOCUMENT_ROOT /srv/miles/current/pharmacy-app/public;
    fastcgi_param HTTPS on;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 60s;
}
