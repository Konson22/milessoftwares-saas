# Petrol Station at {slug}.milesoftwares.com/petrol (and the platform's calls to
# /petrol/platform/...). Included inside the HTTPS server block of
# milesoftwares.conf. Copy to /etc/nginx/miles-products/petrol.conf.
#
# The product runs in its own php-fpm pool (workers and limits of its
# own). Laravel routes are registered under /petrol, so the path is passed
# through unchanged with SCRIPT_NAME=/index.php. On other hosts (apex, auth., app.,
# admin.) the product answers 404: it only serves workspaces.

location = /petrol {
    return 301 /petrol/;
}

# Hashed build assets never change.
location ^~ /petrol/build/ {
    # Built into public/petrol/build, so the URL maps onto public/ as is.
    root /srv/miles/current/petrol-app/public;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
}

location ^~ /petrol/ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.4-fpm-petrol.sock;
    fastcgi_param SCRIPT_FILENAME /srv/miles/current/petrol-app/public/index.php;
    # Front controller at the root: Laravel sees the full /petrol/... path,
    # which is what its routes are registered under.
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /srv/miles/current/petrol-app/public;
    fastcgi_param HTTPS on;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 60s;
}
