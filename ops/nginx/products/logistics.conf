# Logistics at {slug}.milesoftwares.com/logistics (and the platform's calls to
# /logistics/platform/...). Included inside the HTTPS server block of
# milesoftwares.conf. Copy to /etc/nginx/miles-products/logistics.conf.
#
# The product runs in its own php-fpm pool (workers and limits of its
# own). Laravel routes are registered under /logistics, so the path is passed
# through unchanged with SCRIPT_NAME=/index.php. On other hosts (apex, auth., app.,
# admin.) the product answers 404: it only serves workspaces.

location = /logistics {
    return 301 /logistics/;
}

# Hashed build assets never change.
location ^~ /logistics/build/ {
    # Built into public/logistics/build, so the URL maps onto public/ as is.
    root /srv/miles/current/logistics-app/public;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
}

location ^~ /logistics/ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.4-fpm-logistics.sock;
    fastcgi_param SCRIPT_FILENAME /srv/miles/current/logistics-app/public/index.php;
    # Front controller at the root: Laravel sees the full /logistics/... path,
    # which is what its routes are registered under.
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /srv/miles/current/logistics-app/public;
    fastcgi_param HTTPS on;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 60s;
}
