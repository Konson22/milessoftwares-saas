# Finance at {slug}.milessoftwares.com/finance (and the platform's calls to
# /finance/platform/...). Included inside the HTTPS server block of
# milessoftwares.conf. Copy to /etc/nginx/miles-products/finance.conf.
#
# The product runs in its own php-fpm pool (workers and limits of its
# own). Laravel routes are registered under /finance, so the path is passed
# through unchanged with SCRIPT_NAME=/index.php. On other hosts (apex, auth., app.,
# admin.) the product answers 404: it only serves workspaces.

location = /finance {
    return 301 /finance/;
}

# Hashed build assets never change.
location ^~ /finance/build/ {
    # Built into public/finance/build, so the URL maps onto public/ as is.
    root /srv/miles/current/finance-app/public;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
}

location ^~ /finance/ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.4-fpm-finance.sock;
    fastcgi_param SCRIPT_FILENAME /srv/miles/current/finance-app/public/index.php;
    # Front controller at the root: Laravel sees the full /finance/... path,
    # which is what its routes are registered under.
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /srv/miles/current/finance-app/public;
    fastcgi_param HTTPS on;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 60s;
}
