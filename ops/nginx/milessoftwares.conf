# nginx in front of php-fpm for every platform host (see docs/runbooks/dns-tls.md).
#
# One certificate covers milessoftwares.com and *.milessoftwares.com
# (apex, www, auth, app, admin and every {slug} workspace). A wildcard only
# covers one label, which matches the platform: workspaces are always
# {slug}.milessoftwares.com, never deeper.
#
# Security headers (CSP, HSTS, frame denial) are set by the application;
# nginx only adds them for files it serves itself.

# Anything that is not one of our hosts is dropped before reaching PHP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name milessoftwares.com *.milessoftwares.com;

    # ACME HTTP-01 is not used (wildcards need DNS-01); everything redirects.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name milessoftwares.com *.milessoftwares.com;

    ssl_certificate     /etc/letsencrypt/live/milessoftwares.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/milessoftwares.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:miles_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # No OCSP stapling: Let's Encrypt certificates carry no OCSP URL since 2025.

    root /srv/miles/current/central-app/public;
    index index.php;
    charset utf-8;

    client_max_body_size 10m;
    server_tokens off;

    # Hashed build assets never change; cache them for a year.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Products under their workspace path ({slug}.milessoftwares.com/pharmacy),
    # one file each: ops/nginx/products/*.conf. Prefix locations (^~) win
    # over the platform's catch-all below.
    include /etc/nginx/miles-products/*.conf;

    # Never serve dotfiles (.env, .git) even if one ends up under public/.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        internal;
    }

    # No other PHP file is executable.
    location ~ \.php$ {
        return 404;
    }
}
