# nginx behind a Cloudflare Tunnel: use instead of milessoftwares.conf when
# cloudflared on this host carries the traffic (see docs/runbooks/dns-tls.md).
#
# Cloudflare terminates TLS at its edge for milessoftwares.com and
# *.milessoftwares.com; cloudflared forwards to http://localhost:80. So the
# platform listens on loopback only, plain HTTP, and still tells PHP the
# request was HTTPS. Nothing on the network can reach it except cloudflared.
#
# In the tunnel's public hostnames: milessoftwares.com and *.milessoftwares.com
# → http://localhost:80, with a proxied CNAME for each (the wildcard one is not
# created automatically). Turn on "Always Use HTTPS" for the zone.
#
# Security headers (CSP, HSTS, frame denial) are set by the application;
# nginx only adds them for files it serves itself.

# Requests that arrive on the network rather than through the tunnel.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name milessoftwares.com *.milessoftwares.com;

    # The visitor's address, not cloudflared's, for logs, rate limits and audit.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    root /srv/miles/current/central-app/public;
    index index.php;
    charset utf-8;

    client_max_body_size 10m;
    # Responses carry a long Content-Security-Policy and preload Link headers;
    # the default 4k buffer turns them into "upstream sent too big header" 502s.
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;
    server_tokens off;

    # Hashed build assets never change; cache them for a year.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Products under their workspace path, as in milessoftwares.conf.
    include /etc/nginx/miles-products/*.conf;

    # Never serve dotfiles (.env, .git) even if one ends up under public/.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # TLS ended at Cloudflare's edge; the visitor's connection was HTTPS.
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        internal;
    }

    # No other PHP file is executable.
    location ~ \.php$ {
        return 404;
    }
}
