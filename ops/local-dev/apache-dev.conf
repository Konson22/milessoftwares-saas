# Local development on Windows/XAMPP: *.milesoftwares.localhost on port 80.
#
# Copy to D:/srv/apache/miles-dev.conf (included from the end of
# C:/xampp/apache/conf/httpd.conf), then restart Apache.
#
# Production URLs have no port and Wayfinder bakes route hosts into the
# bundle without one, so development must not need a port either.
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>

# Google OAuth only accepts plain http://localhost (no subdomains, no .local)
# as a non-HTTPS redirect URI. Google returns to localhost and this bounces
# the request, query string included, to the auth host where the session lives.
<VirtualHost *:80>
    ServerName localhost
    RedirectMatch 302 "^/auth/google/callback$" "http://auth.milesoftwares.localhost/auth/google/callback"
    # The bare host opens the platform instead of the XAMPP dashboard.
    RedirectMatch 302 "^/$" "http://milesoftwares.localhost/"
</VirtualHost>

<VirtualHost *:80>
    ServerName milesoftwares.localhost
    ServerAlias *.milesoftwares.localhost

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120
    # TRUSTED_PROXIES=127.0.0.1 in each app's .env makes Laravel honour these,
    # so never pass on values a browser sent itself.
    RequestHeader unset X-Forwarded-Host early
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    # Products on workspace hosts: {slug}.milesoftwares.localhost/<path>/...
    # goes to the product's `php artisan serve` with the path preserved.
    # Product routes (and platform-client) register under /<path> themselves.
    # ProxyPass rules match in order: products first, the platform last.
    # Proxying runs before RedirectMatch, so each bare /<path> is excluded
    # from the platform's catch-all for its redirect to /<path>/ to apply.
    #
    #   pharmacy   pharmacy-app              :8400
    #   retail     pharmacy-app (hosted)     :8400
    #   finance    finance-app               :8500
    #   hr         hr-app                    :8600
    #   restaurant restaurant-app            :8700
    #   blueprint  templates/product-app     :8499
    RedirectMatch 301 "^/pharmacy$" "/pharmacy/"
    ProxyPassMatch   "^/pharmacy$" "!"
    ProxyPass        "/pharmacy/" "http://127.0.0.1:8400/pharmacy/"
    ProxyPassReverse "/pharmacy/" "http://127.0.0.1:8400/pharmacy/"

    RedirectMatch 301 "^/retail$" "/retail/"
    ProxyPassMatch   "^/retail$" "!"
    ProxyPass        "/retail/" "http://127.0.0.1:8400/retail/"
    ProxyPassReverse "/retail/" "http://127.0.0.1:8400/retail/"

    RedirectMatch 301 "^/finance$" "/finance/"
    ProxyPassMatch   "^/finance$" "!"
    ProxyPass        "/finance/" "http://127.0.0.1:8500/finance/"
    ProxyPassReverse "/finance/" "http://127.0.0.1:8500/finance/"

    RedirectMatch 301 "^/hr$" "/hr/"
    ProxyPassMatch   "^/hr$" "!"
    ProxyPass        "/hr/" "http://127.0.0.1:8600/hr/"
    ProxyPassReverse "/hr/" "http://127.0.0.1:8600/hr/"

    RedirectMatch 301 "^/restaurant$" "/restaurant/"
    ProxyPassMatch   "^/restaurant$" "!"
    ProxyPass        "/restaurant/" "http://127.0.0.1:8700/restaurant/"
    ProxyPassReverse "/restaurant/" "http://127.0.0.1:8700/restaurant/"

    RedirectMatch 301 "^/logistics$" "/logistics/"
    ProxyPassMatch   "^/logistics$" "!"
    ProxyPass        "/logistics/" "http://127.0.0.1:8800/logistics/"
    ProxyPassReverse "/logistics/" "http://127.0.0.1:8800/logistics/"

    RedirectMatch 301 "^/blueprint$" "/blueprint/"
    ProxyPassMatch   "^/blueprint$" "!"
    ProxyPass        "/blueprint/" "http://127.0.0.1:8499/blueprint/"
    ProxyPassReverse "/blueprint/" "http://127.0.0.1:8499/blueprint/"

    # Everything else: the platform (central-app) on :8100.
    ProxyPass        "/" "http://127.0.0.1:8100/"
    ProxyPassReverse "/" "http://127.0.0.1:8100/"
</VirtualHost>
