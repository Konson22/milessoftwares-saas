; Tatook Logbook's own php-fpm pool (ADR-0025): its own workers and
; limits, so an export never starves the platform or another product.
; Opcache is shared by all pools of the php-fpm service; deploy.sh reloads it.
; Copy to /etc/php/8.4/fpm/pool.d/logbook.conf; nginx reaches it at the
; socket in ops/nginx/products/logbook.conf.
[logbook]
user = miles
group = miles

listen = /run/php/php8.4-fpm-logbook.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; CSV and PDF exports happen in the request (nginx waits 120 s).
request_terminate_timeout = 125s
catch_workers_output = yes
php_admin_value[memory_limit] = 256M
; Attachments up to 10 MB, a little over for the rest of the form.
php_admin_value[upload_max_filesize] = 11M
php_admin_value[post_max_size] = 12M
php_admin_value[expose_php] = Off
php_admin_value[opcache.validate_timestamps] = 0
