; Projects' own php-fpm pool: its own workers and limits, so a
; busy service never starves the platform (or another product). Opcache is
; shared by all pools of the php-fpm service; deploy.sh reloads it.
; Copy to /etc/php/8.4/fpm/pool.d/projects.conf; nginx reaches it at the
; socket in ops/nginx/products/projects.conf. For another product, copy
; this file and rename [projects] and the socket.
[projects]
user = miles
group = miles

listen = /run/php/php8.4-fpm-projects.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; M&E imports and Excel exports happen in the request (nginx waits 120 s).
request_terminate_timeout = 125s
catch_workers_output = yes
php_admin_value[memory_limit] = 256M
; M&E evidence up to 20 MB, a little over for the rest of the form.
php_admin_value[upload_max_filesize] = 21M
php_admin_value[post_max_size] = 22M
php_admin_value[expose_php] = Off
php_admin_value[opcache.validate_timestamps] = 0
