; Pharmacy's own php-fpm pool: its own workers and limits, so a
; busy counter never starves the platform (or another product). Opcache is
; shared by all pools of the php-fpm service; deploy.sh reloads it.
; Copy to /etc/php/8.4/fpm/pool.d/pharmacy.conf; nginx reaches it at the
; socket in ops/nginx/products/pharmacy.conf. For another product, copy
; this file and rename [pharmacy] and the socket.
[pharmacy]
user = miles
group = miles

listen = /run/php/php8.4-fpm-pharmacy.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

request_terminate_timeout = 65s
catch_workers_output = yes
php_admin_value[memory_limit] = 256M
php_admin_value[expose_php] = Off
php_admin_value[opcache.validate_timestamps] = 0
