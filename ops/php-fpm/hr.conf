; HR & Payroll's own php-fpm pool: its own workers and limits, so a
; payroll run never starves the platform (or another product). Opcache is
; shared by all pools of the php-fpm service; deploy.sh reloads it.
; Copy to /etc/php/8.4/fpm/pool.d/hr.conf; nginx reaches it at the
; socket in ops/nginx/products/hr.conf. For another product, copy
; this file and rename [hr] and the socket.
[hr]
user = miles
group = miles

listen = /run/php/php8.4-fpm-hr.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

request_terminate_timeout = 65s
catch_workers_output = yes
php_admin_value[memory_limit] = 256M
; Staff documents up to 8 MB (DocumentController::MAX_KILOBYTES); nginx
; allows 10 MB per request.
php_admin_value[upload_max_filesize] = 9M
php_admin_value[post_max_size] = 10M
php_admin_value[expose_php] = Off
php_admin_value[opcache.validate_timestamps] = 0
