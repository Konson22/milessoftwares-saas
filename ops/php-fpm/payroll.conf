; Payroll's own php-fpm pool: its own workers and limits, so a payroll
; run never starves the platform (or another product). Opcache is shared
; by all pools of the php-fpm service; deploy.sh reloads it.
; Copy to /etc/php/8.4/fpm/pool.d/payroll.conf; nginx reaches it at the
; socket in ops/nginx/products/payroll.conf.
[payroll]
user = miles
group = miles

listen = /run/php/php8.4-fpm-payroll.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Preparing a run happens in the request (nginx waits 120 s).
request_terminate_timeout = 125s
catch_workers_output = yes
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 2M
php_admin_value[post_max_size] = 4M
php_admin_value[expose_php] = Off
php_admin_value[opcache.validate_timestamps] = 0
